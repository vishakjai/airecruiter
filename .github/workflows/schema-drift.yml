# Blocks NEW drift between the code's queries and the schema the repo declares.
#
# Discovery over this repo found 15 tables that application code reads or writes but
# which no CREATE TABLE declares, and a run against a fresh database confirmed it: 18
# endpoints return 500 with `relation "..." does not exist`. Those 15 are baselined in
# scripts/schema_drift_baseline.txt so this can be adopted today; the check fails on
# anything new, and on anything baselined that has since been declared, so the file
# cannot quietly rot.
name: Schema Drift

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  schema-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Standard library only — no install step, nothing to keep in sync.
      - name: Check code-referenced tables exist in the schema
        run: python scripts/check_schema_drift.py
